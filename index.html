<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101923"><meta name="description" content="PSO2旧国全13职业技能树加点模拟器，含游戏技能图标、前置技能、技能详情与配点保存。"><title>PSO2 旧国 · 天赋加点模拟器</title><link rel="stylesheet" href="style.css"><script defer src="data.js"></script><script defer src="defaults.js"></script><script defer src="engine.js"></script><script defer src="ui-i18n.js"></script><script defer src="app.js"></script></head><body>
<header><a class="brand" href="./"><b>PSO<span>2</span></b><span class="edition">CLASSIC<br>旧国</span></a><div class="title"><h1>天赋加点模拟器</h1><span>by:fuwashiroha</span></div><div class="header-actions"><button id="lang-toggle" aria-label="切换中文和日文">日本語</button><span id="save-status">本地自动保存</span><button id="share" class="primary">复制本机配点链接</button></div></header>
<div class="layout"><aside class="sidebar"><div class="nav-title">职业 <span>13 CLASSES</span></div><nav id="classes" aria-label="职业列表"></nav><div class="source"><p>游戏图像 © SEGA</p></div></aside>
<main><section class="buildbar" aria-label="主副职业配置"><div id="main-build"></div><div id="sub-build"></div></section><div class="toolbar"><div><h2 id="tree-title"></h2><span id="skill-count"></span></div><div class="tools"><label>缩放 <select id="zoom"><option value="0.7">70%</option><option value="0.85">85%</option><option value="1" selected>100%</option><option value="1.15">115%</option></select></label><button id="restore-default">恢复截图配点</button><button id="reset">重置当前树</button></div></div><div class="legend"><span><i class="learned"></i>已习得</span><span><i class="available"></i>可加点</span><span><i class="locked"></i>前置未满足</span><span class="main-only">主职限定</span><span class="instruction">点等级直接加点 · 自动补齐前置 · 右键减点</span></div>
<div class="workspace"><div id="tree-scroll" tabindex="0" aria-label="技能树，可横向滚动"><div id="tree-size"><div id="tree"><svg id="connections" aria-hidden="true"></svg><div id="nodes"></div></div></div></div><aside id="detail" aria-label="技能详情"></aside></div><footer>职业等级 + 追加 SP = 可用总 SP；初始技能与自动习得技能不消耗 SP。追加 SP 请按已完成的职业任务设置。</footer></main></div><div id="toast" role="status" aria-live="polite"></div>
<dialog id="share-dialog"><h2>配点链接</h2><p>复制此链接，可恢复当前主副职业与配点。</p><textarea id="share-url" readonly aria-label="配点链接"></textarea><button id="close-share">关闭</button></dialog>
</body></html>
